# Site settings
title: Jonatan Männchen
email: jonatan@maennchen.ch
phone: +41 78 724 57 90
description: > # this means to ignore newlines until "baseurl:"
  Jonatan Männchen — CISO at the Erlang Ecosystem Foundation.
  Securing open-source infrastructure through code, standards, and collaboration.
baseurl: "" # the subpath of your site, e.g. /blog/
url: "https://maennchen.dev" # the base hostname & protocol for your site
twitter_username: maennchen_
github_username:  maennchen
asset_version: 2

# SEO (jekyll-seo-tag)
author:
  name: Jonatan Männchen
  twitter: maennchen_
twitter:
  username: maennchen_
  card: summary
logo: /android-chrome-512x512.png

defaults:
  - scope:
      path: ""
    values:
      image: /android-chrome-512x512.png

# Build settings
markdown: kramdown
plugins:
  - jekyll-seo-tag
  - jekyll-sitemap
include:
  - .well-known
exclude:
  - config.ru
  - Gemfile
  - Gemfile.lock
  - vendor
  - Procfile
  - Rakefile
  - .devcontainer.json
  - .github
  - .claude
  - .devenv*
  - devenv.*
  - .direnv
  - .envrc
  - .mcp.json
  - .ruby-lsp

# Sass
sass:
  style: :compressed
